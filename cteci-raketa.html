<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Čtecí raketa – sestřel slovo tím, že ho přečteš</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#10263a;--sky2:#1d4260;--cream:#fff3d9;--ink:#1d2433;--muted:#9fb6c8;--line:#2e5677;
  --mint:#62d9b5;--coral:#ff7a5c;--sun:#ffc94d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky:#10263a;--sky2:#1d4260;--cream:#fff3d9;--ink:#1d2433;--muted:#9fb6c8;--line:#2e5677}}
:root[data-theme="dark"]{--sky:#10263a;--sky2:#1d4260;--cream:#fff3d9;--ink:#1d2433;--muted:#9fb6c8;--line:#2e5677}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--sky);color:var(--cream);font-family:Andika,"Segoe UI",system-ui,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

#top{position:fixed;left:0;right:0;top:0;display:none;align-items:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 14px) 8px calc(env(safe-area-inset-left,0px) + 14px);font-size:18px}
#top.on{display:flex}
#hearts{font-size:22px;letter-spacing:2px}
#score{margin-left:auto;font-weight:700;font-size:22px;color:var(--sun)}
#pauseBtn{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:18px}

#bar{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;gap:6px;
  padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
#bar.on{display:flex}
#feedback{min-height:28px;font-size:20px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#feedback.ok{color:var(--mint)} #feedback.bad{color:var(--coral)}
#micBtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--sun);color:var(--ink);display:grid;place-items:center;
  box-shadow:0 6px 0 #b8861d;position:relative}
#micBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #b8861d}
#micBtn.listen{background:var(--coral);box-shadow:0 6px 0 #b54a32}
#micBtn.listen::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--coral);animation:pulse 1s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
#micBtn svg{width:44px;height:44px}
#okBtn{display:none;min-width:240px;padding:16px 22px;border:0;border-radius:18px;background:var(--mint);color:var(--ink);font-size:24px;font-weight:700;box-shadow:0 6px 0 #33a283}
#okBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #33a283}
#barHint{font-size:15px;color:var(--muted)}

.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:none;overflow-y:auto;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px);
  background:rgba(10,24,37,.72)}
.screen.on{display:flex}
.panel{width:min(480px,100%);margin:auto}
.title{font-size:clamp(46px,12vw,72px);font-weight:700;line-height:.95;margin:0 0 10px;color:var(--cream)}
.title span{display:block;color:var(--sun)}
.lead{font-size:19px;line-height:1.4;margin:0 0 18px;color:var(--cream)}
.card{background:rgba(16,38,58,.92);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:18px}
.row:last-child{border-bottom:0}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{background:none;border:0;padding:7px 11px;border-radius:9px;font-size:17px;color:var(--muted)}
.seg button.on{background:var(--cream);color:var(--ink);font-weight:700}
.tog{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:18px}
.tog input{width:22px;height:22px;accent-color:var(--sun)}
.big{display:block;width:100%;margin:18px 0 6px;padding:16px;border:0;border-radius:18px;background:var(--sun);color:var(--ink);font-size:24px;font-weight:700;box-shadow:0 6px 0 #b8861d}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b8861d}
.ghost{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:16px;background:none;font-size:19px}
.note{font-size:15px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.note.warn{color:var(--coral)}
.center{text-align:center}
.stats{display:flex;justify-content:center;gap:28px;margin:10px 0 14px}
.stats b{display:block;font-size:40px;color:var(--sun);line-height:1}
.stats span{font-size:16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chips button{background:var(--cream);color:var(--ink);border:0;border-radius:12px;padding:8px 14px;font-size:22px;font-weight:700}
h2{font-size:clamp(36px,9vw,52px);margin:4px 0 6px;line-height:1}
@media (prefers-reduced-motion:reduce){#micBtn.listen::after{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Herní plocha se slovy"></canvas>

<div id="top">
  <span id="hearts" aria-label="Životy"></span>
  <span id="readCount"></span>
  <span id="score">0</span>
  <button id="pauseBtn" aria-label="Pauza">❚❚</button>
</div>

<div id="bar">
  <div id="feedback" aria-live="polite"></div>
  <button id="micBtn" aria-label="Zapnout mikrofon a číst">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8.5 21.5h7"/></svg>
  </button>
  <button id="okBtn">Přečteno správně</button>
  <div id="barHint">Ťukni a přečti slovo</div>
</div>

<section id="menu" class="screen on">
  <div class="panel">
    <h1 class="title">Čtecí <span>raketa</span></h1>
    <p class="lead">Shora padají slova. Ťukni na mikrofon a přečti jedno nahlas. Když ho přečteš správně, raketa ho sestřelí dřív, než doletí dolů.</p>
    <div class="card">
      <div class="row"><span>Slova</span><div class="seg" data-k="level"><button data-v="0">Krátká</button><button data-v="1">Delší</button><button data-v="2">Dlouhá</button></div></div>
      <div class="row"><span>Písmo</span><div class="seg" data-k="caps"><button data-v="1">VELKÁ</button><button data-v="0">malá</button></div></div>
      <div class="row"><span>Tempo</span><div class="seg" data-k="tempo"><button data-v="0">Pomalé</button><button data-v="1">Střední</button><button data-v="2">Rychlé</button></div></div>
      <div class="row"><span>Kdo hodnotí</span><div class="seg" data-k="judge"><button data-v="mic">Mikrofon</button><button data-v="adult">Dospělý</button></div></div>
      <label class="tog"><input type="checkbox" id="optSay"><span>Zmeškané slovo přečíst nahlas</span></label>
    </div>
    <p class="note" id="srNote"></p>
    <button class="big" id="startBtn">Start</button>
  </div>
</section>

<section id="pause" class="screen">
  <div class="panel center">
    <h2>Pauza</h2>
    <button class="big" id="resumeBtn">Pokračovat</button>
    <button class="ghost" id="quitBtn">Konec hry</button>
  </div>
</section>

<section id="over" class="screen">
  <div class="panel center">
    <h2>Konec hry</h2>
    <div class="stats"><div><b id="oRead">0</b><span>přečtených slov</span></div><div><b id="oScore">0</b><span>bodů</span></div></div>
    <div id="oMissWrap"><p class="note">Tato slova si ještě procvič. Ťuknutím si je poslechneš.</p><div class="chips" id="oMiss"></div></div>
    <button class="big" id="againBtn">Hrát znovu</button>
    <button class="ghost" id="menuBtn">Nastavení</button>
  </div>
</section>

<script>
(function(){
const WORDS=[
 ['máma','táta','pes','les','mísa','pila','sova','koza','voda','ruka','noha','kolo','lev','mák','sůl','dům','myš','sýr','ryba','nos','oko','ucho','vosa','žába','kos','had','rak','vlk','list','den','noc','med','lano','jaro','zima','léto','pole','hora','dort','mýdlo','kytka','míč','byt','husa','babi','děda','teta','strýc','syn','dcera','kluk','holka','pán','žák','kůň','kráva','ovce','liška','srna','jelen','vrána','kapr','dub','lípa','mech','sen','led','sníh','mrak','vítr','hrad','most','zub','prst','vlas','čelo','krk','záda','bota','šála','čaj','maso','rýže','mouka','hrnek','lžíce','talíř','loď','vůz','kaše','tma','jde','pije','spí','běží','sedí','stojí','píše','čte','zpívá','hraje','skáče','nese','veze','vaří','peče','myje','plave','letí','padá','volá','dělá','vidí','slyší','chce','umí','jít','jíst','pít','spát','číst','psát','mít','dát','hrát','nést','péct','mýt','šít','běžet','sedět','stát','volám','mám','jdu','piju','spím','čtu','píšu','hraju','jedu','nesu','malý','velký','nový','starý','dobrý','zlý','mladý','hezký','milý','bílý','černý','modrý','žlutý','šedý','tmavý','suchý','mokrý','teplý','rychlý','sladký','slaný','hladký','tvrdý','měkký','tichý','plný','prázdný','dlouhý','krátký','nízký','tlustý','čistý','hnědý','horký','tady','tam','teď','dnes','včera','zítra','ráno','večer','brzy','pozdě','hned','dole','doma','venku','rychle','hodně','málo','moc','trochu','nikdy','spolu','sám','sama','jedna','dva','tři','čtyři','pět','šest','sedm','osm','devět','deset','sto','náš','váš','můj','tvůj','kdo','kde','kam','proč','jak','kdy','ano','lama','auto','kino','mapa','lupa','park','džus','lampa','váza'],
 ['kočka','slunce','strom','škola','tráva','hruška','jablko','mrkev','okno','kniha','pták','želva','zebra','myška','tužka','stůl','židle','sešit','houba','medvěd','zajíc','vlak','letadlo','loďka','klíč','hvězda','měsíc','mráček','brouk','šnek','včela','motýl','jahoda','rohlík','chleba','mléko','kabát','čepice','postel','kámen','obrázek','zahrada','babička','dědeček','maminka','tatínek','sestra','bratr','učitel','hasič','kuchař','prodavač','třída','tabule','lavice','pravítko','nůžky','lepidlo','barvička','bunda','triko','šaty','boty','klobouk','deštník','vlaštovka','holub','sýkorka','kohout','slepice','kuře','prase','koník','pejsek','kotě','štěně','králík','křeček','opice','tygr','slon','žralok','klokan','tučňák','pavouk','okurka','rajče','paprika','cibule','brambora','švestka','třešeň','meruňka','malina','borůvka','ořech','sušenka','polévka','knedlík','buchta','koláč','pomeranč','řeka','rybník','kopec','skála','louka','jezero','moře','ostrov','město','vesnice','ulice','obchod','nádraží','hřiště','zámek','kostel','náklaďák','pračka','maluje','kreslí','počítá','uklízí','vstává','snídá','pláče','tancuje','kreslit','malovat','počítat','uklízet','zpívat','tancovat','skákat','běhat','plavat','létat','stavět','vařit','otevřít','zavřít','jezdit','chodit','hledat','najít','ukázat','povídat','sbírat','házet','chytat','kopat','běháme','plaveme','zpíváme','studený','pomalý','kyselý','vysoký','hubený','špinavý','zelený','červený','růžový','veselý','smutný','hodný','zlobivý','chytrý','šikovný','statečný','ospalý','hladový','unavený','nemocný','zdravý','krásný','ošklivý','chladný','nahoře','pomalu','potichu','nahlas','společně','vesele','smutně','krásně','daleko','blízko','uvnitř','vpředu','vzadu','nalevo','napravo','nejdřív','potom','nakonec','často','občas','někdy','vždycky','zpátky','jedenáct','dvanáct','dvacet','třicet','padesát','tisíc','první','druhý','třetí','někdo','nikdo','něco','všichni','každý','který','jaký','banán','citron','pirát','doktor','aktovka','penál','guma','delfín','bonbon','jogurt','raketa','traktor','telefon'],
 ['čokoláda','krokodýl','zmrzlina','kamarád','prázdniny','pohádka','princezna','čarodějnice','počítač','velryba','chobotnice','nemocnice','knihovna','ponožky','kalhoty','pantofle','žirafa','papoušek','veverka','sněhulák','narozeniny','dobrodružství','vrtulník','ponorka','křižovatka','kominík','kouzelník','rytíř','jednorožec','palačinka','jezevec','bramborák','pastelka','rukavice','nosorožec','medvídek','ještěrka','beruška','housenka','mravenec','kobylka','sluníčko','kytička','sedmikráska','pampeliška','slunečnice','rozhledna','vodopád','lednička','vysavač','zahradník','prodavačka','brankář','kuchařka','hvězdárna','dalekohled','letiště','parník','plachetnice','popelnice','popelář','broskev','perník','vánočka','kamarádka','učitelka','obrovský','nádherný','kouzelný','nakupovat','vyprávět','přemýšlet','rozsvítit','zapomenout','připravit','poskakovat','převlékat','malujeme','počítáme','uklízíme','tancujeme','vystupovat','nastupovat','vyhrávat','pozorovat','objevovat','cestovat','opravovat','zahrajeme','uvaříme','upečeme','vymalovat','omalovánky','stavebnice','skládačka','houpačka','klouzačka','prolézačka','pískoviště','koloběžka','kolotoč','zastávka','návštěva','dovolená','překvapení','hřebínek','kartáček','zrcátko','svačina','hodinky','kočárek','panenka','kamarádi','poslouchat','odpočívat','zalévat','probudit','usínat','oblékat','zavazovat','vymyslet','rozumět','fialový','nejmenší','největší','nejlepší','nejrychlejší','nebezpečný','zajímavý','překvapený','rozzlobený','vystrašený','kamarádský','pohádkový','čokoládový','jahodový','zmrzlinový','sněhobílý','neposedný','zvědavý','pracovitý','usměvavý','dohromady','najednou','opatrně','šikovně','odpoledne','dopoledne','pozítří','předevčírem','nejdříve','třináct','čtrnáct','patnáct','šestnáct','sedmnáct','osmnáct','devatenáct','osmdesát','devadesát','dinosaurus','televize','semafor','motorka','autobus','tramvaj','limonáda','fotoaparát','kalkulačka','kosmonaut','veterinář','policista','fotbalista','planeta','špagety','mandarinka','ananas','telefonovat','fotografovat','trampolína','lokomotiva','vagonek','parkoviště','pyžamo']
];
const TEMPO=[{fall:24,max:1,gap:3},{fall:16,max:2,gap:2.6},{fall:11,max:3,gap:2}];

let S={level:0,caps:1,tempo:0,judge:'mic',say:true};
try{const s=JSON.parse(localStorage.getItem('cteci-raketa')||'null');if(s)Object.assign(S,s);}catch(e){}
function saveS(){try{localStorage.setItem('cteci-raketa',JSON.stringify(S));}catch(e){}}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let cw=1,ch=1,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cw=window.innerWidth;ch=window.innerHeight;cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);}
window.addEventListener('resize',resize);resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const show=t=>S.caps?t.toLocaleUpperCase('cs'):t;

/* stars */
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:rand(.5,1.8),s:rand(.2,1)}));

/* ---------- state ---------- */
let G=null,state='menu',bag=[];
function nextWord(){if(!bag.length)bag=shuffle(WORDS[S.level].slice());return bag.pop();}
function fontSize(){return Math.round(Math.max(26,Math.min(46,cw/8.5)));}
function dangerY(){const bar=$('bar').getBoundingClientRect();return (bar.top||ch-150)-44;}

function newGame(){
  bag=[];
  G={words:[],parts:[],beams:[],lives:3,score:0,read:0,streak:0,missed:[],spawnT:0,speedK:1,t:0};
  state='play';hideScreens();$('top').classList.add('on');$('bar').classList.add('on');
  setupBar();updHud();fb('');
  spawn();
}
function spawn(){
  const text=nextWord(),fs=fontSize();
  ctx.font=`700 ${fs}px Andika, "Segoe UI", sans-serif`;
  const w=ctx.measureText(show(text)).width+fs*.9,h=fs*1.5;
  const x=rand(12,Math.max(12,cw-w-12));
  G.words.push({text,x,y:-h-4,w,h,fs,hit:false,flash:0});
  G.spawnT=0;
}
function updHud(){
  $('hearts').textContent='❤️'.repeat(G.lives)+'🤍'.repeat(Math.max(0,3-G.lives));
  $('score').textContent=G.score;
  $('readCount').textContent='📖 '+G.read;
}

/* ---------- screens ---------- */
function hideScreens(){['menu','pause','over'].forEach(i=>$(i).classList.remove('on'));}
function renderMenu(){
  document.querySelectorAll('.seg[data-k]').forEach(seg=>{const k=seg.dataset.k;
    [...seg.children].forEach(b=>b.classList.toggle('on',String(S[k])===b.dataset.v));});
  $('optSay').checked=!!S.say;
  const n=$('srNote');
  if(!SR){n.textContent='Tento prohlížeč neumí rozpoznávat řeč. Hodnotí dospělý, nebo hru otevři v Chrome či Safari.';n.className='note warn';}
  else if(S.judge==='mic'){n.textContent='Rozpoznávání řeči potřebuje internet a povolený mikrofon.';n.className='note';}
  else{n.textContent='Dítě čte nahlas a dospělý ťukne na „Přečteno správně“. Sestřelí se nejnižší slovo.';n.className='note';}
}
document.querySelectorAll('.seg[data-k]').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const k=seg.dataset.k;
  S[k]=(k==='judge')?b.dataset.v:+b.dataset.v;saveS();renderMenu();}));
$('optSay').addEventListener('change',e=>{S.say=e.target.checked;saveS();});
if(!SR)S.judge='adult';
$('startBtn').addEventListener('click',()=>{try{document.fonts&&document.fonts.load('700 40px Andika');}catch(e){}newGame();});
$('pauseBtn').addEventListener('click',pause);
$('resumeBtn').addEventListener('click',()=>{hideScreens();state='play';});
$('quitBtn').addEventListener('click',()=>{stopRec();gameOver();});
$('againBtn').addEventListener('click',newGame);
$('menuBtn').addEventListener('click',toMenu);
function toMenu(){stopRec();state='menu';G=null;$('top').classList.remove('on');$('bar').classList.remove('on');hideScreens();renderMenu();$('menu').classList.add('on');}
function pause(){if(state!=='play')return;stopRec();state='pause';$('pause').classList.add('on');}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});

function setupBar(){
  const mic=S.judge==='mic'&&!!SR;
  $('micBtn').style.display=mic?'grid':'none';
  $('okBtn').style.display=mic?'none':'block';
  $('barHint').textContent=mic?'Ťukni a přečti slovo':'Dítě čte nejnižší slovo nahlas';
}
let fbT=0;
function fb(t,cls){const f=$('feedback');f.textContent=t;f.className=cls||'';fbT=performance.now();}

/* ---------- speech ---------- */
let rec=null,listening=false,heard='',gotHit=false;
function stopRec(){if(rec){try{rec.abort();}catch(e){}}rec=null;setListen(false);}
function setListen(on){listening=on;$('micBtn').classList.toggle('listen',on);
  $('barHint').textContent=on?'Poslouchám… čti nahlas':(S.judge==='mic'?'Ťukni a přečti slovo':$('barHint').textContent);}
$('micBtn').addEventListener('click',()=>{
  if(state!=='play')return;
  if(listening){try{rec&&rec.stop();}catch(e){}return;}
  try{
    rec=new SR();rec.lang='cs-CZ';rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
  }catch(e){fb('Mikrofon se nepodařilo spustit.','bad');return;}
  heard='';gotHit=false;
  rec.onstart=()=>{setListen(true);fb('');};
  rec.onresult=e=>{
    if(gotHit)return;
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      for(let a=0;a<r.length;a++){
        const t=r[a].transcript;if(a===0&&t.trim())heard=t.trim();
        if(tryMatch(t,r.isFinal)){gotHit=true;try{rec.abort();}catch(_){}return;}
      }
    }
  };
  rec.onerror=e=>{
    const m={'not-allowed':'Mikrofon není povolený. Povol ho v prohlížeči, nebo v nastavení zvol „Dospělý“.',
      'service-not-allowed':'Rozpoznávání řeči tu není dostupné. V nastavení zvol „Dospělý“.',
      'network':'Rozpoznávání řeči potřebuje internet.','audio-capture':'Nenašel jsem mikrofon.','no-speech':'Nic jsem neslyšel. Zkus to znovu a hlasitěji.'}[e.error];
    if(m){fb(m,'bad');heard='';gotHit=true;}
  };
  rec.onend=()=>{setListen(false);rec=null;
    if(!gotHit){if(heard)miss(heard);else fb('Nic jsem neslyšel. Zkus to znovu.','bad');}
  };
  try{rec.start();}catch(e){fb('Mikrofon se nepodařilo spustit.','bad');}
});
$('okBtn').addEventListener('click',()=>{
  if(state!=='play')return;
  const w=G.words.filter(w=>!w.hit).sort((a,b)=>b.y-a.y)[0];
  if(w){hitWord(w);}
});

function tryMatch(text,final){
  const toks=norm(text).split(' ').filter(Boolean);if(!toks.length)return false;
  const whole=toks.join('');
  const live=G.words.filter(w=>!w.hit).sort((a,b)=>b.y-a.y);
  let any=false;
  for(const w of live){
    const t=norm(w.text);
    let ok=toks.includes(t)||whole===t;
    if(!ok&&final){const tol=t.length>=10?2:t.length>=6?1:0;ok=tol>0&&(toks.some(x=>lev(x,t)<=tol)||lev(whole,t)<=tol);}
    if(ok){hitWord(w);any=true;}
  }
  return any;
}
function miss(h){
  G.streak=0;fb('Slyšel jsem: „'+h+'“','bad');
}
function hitWord(w){
  w.hit=true;w.flash=1;
  G.streak++;G.read++;
  G.score+=w.text.length*10+Math.min(G.streak,10)*5;
  if(G.read%5===0)G.speedK=Math.min(1.7,G.speedK*1.05);
  fb(['Správně!','Výborně!','Super!','Paráda!','Bezva!'][Math.floor(Math.random()*5)],'ok');
  const sx=cw/2,sy=dangerY()+22;
  G.beams.push({x1:sx,y1:sy-20,x2:w.x+w.w/2,y2:w.y+w.h/2,t:0});
  const letters=[...show(w.text)];
  letters.forEach((l,i)=>G.parts.push({ch:l,x:w.x+w.fs*.45+i*(w.w-w.fs*.9)/letters.length,y:w.y+w.h*.7,vx:rand(-160,160),vy:rand(-320,-120),rot:0,vr:rand(-6,6),t:0,life:1.1,fs:w.fs}));
  for(let i=0;i<18;i++){const a=rand(0,Math.PI*2),s=rand(60,260);G.parts.push({x:w.x+w.w/2,y:w.y+w.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rand(.4,.8),c:['#ffc94d','#62d9b5','#fff3d9'][i%3]});}
  ding();updHud();
}
function lost(w){
  w.hit=true;G.lives--;G.streak=0;G.missed.push(w.text);
  fb('Uteklo slovo: '+show(w.text),'bad');
  for(let i=0;i<20;i++){const a=rand(Math.PI,Math.PI*2),s=rand(60,240);G.parts.push({x:w.x+w.w/2,y:w.y+w.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rand(.4,.9),c:'#ff7a5c'});}
  if(S.say)say(w.text);
  try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}
  updHud();
  if(G.lives<=0)setTimeout(gameOver,700);
}
function gameOver(){
  if(!G)return;stopRec();state='over';
  $('top').classList.remove('on');$('bar').classList.remove('on');
  $('oRead').textContent=G.read;$('oScore').textContent=G.score;
  const uniq=[...new Set(G.missed)];
  $('oMissWrap').style.display=uniq.length?'block':'none';
  $('oMiss').innerHTML=uniq.map(t=>`<button data-t="${t}">${show(t)}</button>`).join('');
  hideScreens();$('over').classList.add('on');
}
$('oMiss').addEventListener('click',e=>{const b=e.target.closest('button');if(b)say(b.dataset.t);});

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function ding(){const a=ac();if(!a)return;const t=a.currentTime;
  [660,990].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+i*.08);g.gain.exponentialRampToValueAtTime(.12,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.3);
    o.connect(g);g.connect(a.destination);o.start(t+i*.08);o.stop(t+i*.08+.32);});}
function say(text){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='cs-CZ';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/^cs/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
try{window.speechSynthesis&&speechSynthesis.getVoices();}catch(e){}

/* ---------- loop ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function drawShip(x,y,t){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(255,201,77,'+(.5+.3*Math.sin(t*12))+')';ctx.beginPath();ctx.moveTo(-8,22);ctx.lineTo(0,34+4*Math.sin(t*20));ctx.lineTo(8,22);ctx.fill();
  ctx.fillStyle='#fff3d9';ctx.beginPath();ctx.moveTo(0,-26);ctx.quadraticCurveTo(15,-6,12,22);ctx.lineTo(-12,22);ctx.quadraticCurveTo(-15,-6,0,-26);ctx.fill();
  ctx.fillStyle='#ff7a5c';ctx.beginPath();ctx.moveTo(-12,8);ctx.lineTo(-22,24);ctx.lineTo(-11,22);ctx.fill();ctx.beginPath();ctx.moveTo(12,8);ctx.lineTo(22,24);ctx.lineTo(11,22);ctx.fill();
  ctx.fillStyle='#1d4260';ctx.beginPath();ctx.arc(0,-4,5.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#0b1d2d');g.addColorStop(1,'#1d4260');
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  const drift=now/1000;
  stars.forEach(s=>{const y=((s.y*ch+drift*8*s.s)%ch);ctx.globalAlpha=.35+.5*s.s;ctx.fillStyle='#fff3d9';ctx.fillRect(s.x*cw,y,s.r,s.r);});
  ctx.globalAlpha=1;
  if(G&&(state==='play'||state==='pause'||state==='over')){
    const run=state==='play';
    const dy=dangerY();
    if(run){
      G.t+=dt;
      const tp=TEMPO[S.tempo];
      const speed=(dy+80)/tp.fall*G.speedK*(listening?.5:1);
      G.spawnT+=dt;
      const live=G.words.filter(w=>!w.hit);
      const lastW=live.reduce((m,w)=>w.y<m.y?w:m,{y:1e9});
      if(!live.length||(live.length<tp.max&&G.spawnT>tp.gap&&lastW.y>90))spawn();
      G.words.forEach(w=>{if(w.hit)return;w.y+=speed*dt;if(w.y+w.h>dy)lost(w);});
      G.words=G.words.filter(w=>!w.hit||w.flash>0);
      if(fbT&&now-fbT>2600){$('feedback').textContent='';fbT=0;}
    }
    // danger line
    ctx.strokeStyle='rgba(255,122,92,.35)';ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,dy);ctx.lineTo(cw,dy);ctx.stroke();ctx.setLineDash([]);
    const target=S.judge!=='mic'||!SR?G.words.filter(w=>!w.hit).sort((a,b)=>b.y-a.y)[0]:null;
    G.words.forEach(w=>{
      if(w.hit){w.flash-=dt*4;if(w.flash<=0)return;ctx.globalAlpha=w.flash;}
      const danger=Math.max(0,Math.min(1,(w.y+w.h-dy*.55)/(dy*.45)));
      ctx.fillStyle='rgba(0,0,0,.25)';rr(w.x+3,w.y+5,w.w,w.h,w.h*.3);ctx.fill();
      ctx.fillStyle=w.hit?'#62d9b5':'#fff3d9';rr(w.x,w.y,w.w,w.h,w.h*.3);ctx.fill();
      if(!w.hit&&(danger>0||w===target)){ctx.strokeStyle=w===target?'#ffc94d':`rgba(255,122,92,${danger})`;ctx.lineWidth=w===target?4:3;rr(w.x,w.y,w.w,w.h,w.h*.3);ctx.stroke();}
      ctx.fillStyle='#1d2433';ctx.font=`700 ${w.fs}px Andika, "Segoe UI", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(show(w.text),w.x+w.w/2,w.y+w.h/2+1);
      ctx.globalAlpha=1;
    });
    G.beams=G.beams.filter(b=>{b.t+=dt;if(b.t>.35)return false;
      ctx.strokeStyle=`rgba(255,201,77,${1-b.t/.35})`;ctx.lineWidth=6*(1-b.t/.35)+1;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();return true;});
    G.parts=G.parts.filter(p=>{if(run)p.t+=dt;if(p.t>p.life)return false;if(run){p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
      ctx.globalAlpha=1-p.t/p.life;
      if(p.ch){if(run)p.rot+=p.vr*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle='#62d9b5';ctx.font=`700 ${p.fs}px Andika, sans-serif`;ctx.textAlign='center';ctx.fillText(p.ch,0,0);ctx.restore();}
      else{ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
      ctx.globalAlpha=1;return true;});
    drawShip(cw/2,dy+22,now/1000);
  }
  requestAnimationFrame(loop);
}
renderMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
